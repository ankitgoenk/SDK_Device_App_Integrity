name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  catalog:
    name: Signal catalog consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Every SignalId in code must have a documented technique, weight, FP analysis
      # and known bypass in docs/DETECTION_CATALOG.md.
      - run: tools/check-signal-catalog.py

  quality:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # --no-configuration-cache: the ktlint Gradle plugin (12.2.0) holds a Project
      # reference in its task state, which the configuration cache cannot serialize
      # (124 problems). Scoped to this job so the cache still benefits the real build.
      - run: ./gradlew detekt ktlintCheck --no-configuration-cache

  api:
    name: Public API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the pinned NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      # Fails when the committed api/*.api dumps no longer match the source.
      # Regenerate deliberately with ./gradlew apiDump and review the diff.
      - run: ./gradlew apiCheck

  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the pinned NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assemble testDebugUnitTest test lint

      - name: Assert the shipped .so is stripped, unexported and within budget
        run: |
          set -euo pipefail
          # Assert on the AAR, not on build intermediates. Globbing intermediates picks up
          # pre-strip stages that were never going to ship, which is a property of the
          # build directory rather than of the artifact.
          aar=$(find integrity-native/build/outputs/aar -name '*-release.aar' | head -1)
          test -n "$aar"
          echo "inspecting $aar"
          rm -rf /tmp/aar && mkdir -p /tmp/aar
          unzip -q -o "$aar" -d /tmp/aar
          mapfile -t libs < <(find /tmp/aar/jni -name 'libintegrity.so' | sort)
          echo "shipped ABIs: ${#libs[@]}"
          test "${#libs[@]}" -eq 3
          for so in "${libs[@]}"; do
            size=$(stat -c%s "$so")
            echo "--- $so ($size bytes)"
            # ADR-0002: dynamic registration, so no greppable Java_* entry points.
            if nm -D --defined-only "$so" 2>/dev/null | grep -q 'Java_io_integrity'; then
              echo "FAIL: $so exports a Java_io_integrity_* symbol"; exit 1
            fi
            if readelf -S "$so" | grep -q '\.debug_info'; then
              echo "FAIL: $so is not stripped"; exit 1
            fi
            if [ "$size" -gt 262144 ]; then
              echo "FAIL: $so exceeds the 256 KB per-ABI budget"; exit 1
            fi
          done

  instrumented:
    name: Instrumented smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the pinned NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # google_apis is a userdebug image: it ships su and reports test-keys, so the
          # root detectors fire here. Clean-only tests are excluded and run in the
          # clean-baseline job against a release-keys image instead.
          script: >-
            ./gradlew connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.notAnnotation=io.integrity.detector.root.CleanDeviceOnly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports
          path: '**/build/reports/androidTests/'

  consumer:
    name: AAR consumer (published artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the pinned NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4

      - name: Publish the SDK to a local Maven repository
        run: ./gradlew publishAllPublicationsToLocalRepoRepository

      - name: Show what was published
        run: find build/local-maven -name '*.aar' -o -name '*.pom' | sort

      # sample-consumer is a separate Gradle build, so these coordinates can only resolve
      # from the AARs published above. R8 is on for the release build, which is what
      # exercises the consumer ProGuard rules shipped inside the AAR.
      - name: Build the consumer against the published AARs
        run: ./gradlew -p sample-consumer assembleDebug assembleRelease assembleDebugAndroidTest

      - name: Assert the ADR-0004 queries merged in from the AAR
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find sample-consumer/build -path '*merged_manifest*' \
            -name 'AndroidManifest.xml' ! -path '*ndroidTest*')
          echo "found ${#manifests[@]} merged manifest(s)"
          test "${#manifests[@]}" -gt 0
          for m in "${manifests[@]}"; do
            echo "--- $m"
            grep -q 'com.topjohnwu.magisk' "$m" \
              || { echo "FAIL: detector-environment <queries> did not merge into $m"; exit 1; }
            grep -q 'com.guoshi.httpcanary' "$m" \
              || { echo "FAIL: MITM-proxy queries entry missing from $m"; exit 1; }
            if grep -q 'QUERY_ALL_PACKAGES' "$m"; then
              echo "FAIL: QUERY_ALL_PACKAGES must never be declared (ADR-0004)"; exit 1
            fi
          done

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew -p sample-consumer connectedDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-reports
          path: 'sample-consumer/build/reports/'

  clean-baseline:
    name: Clean-device negative control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the pinned NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # google_apis_playstore is a release-keys image without su, so it is the closest
      # thing to a stock device available in CI. If a root detector fires here, that is a
      # finding about the detector being too broad, not a flaky job.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis_playstore
          script: >-
            ./gradlew :integrity-detector-root:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.annotation=io.integrity.detector.root.CleanDeviceOnly

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-baseline-reports
          path: 'integrity-detector-root/build/reports/androidTests/'

  native-host:
    name: Native logic (host toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pure half of the native core carries no Android headers precisely so it can be
      # tested here. Logic that can only run on a device is logic that rarely gets run.
      - name: Build and run the native host tests
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DINTEGRITY_BUILD_TOKEN='"ci-host-token"' \
            integrity-native/src/main/cpp/selfcheck.cpp \
            integrity-native/src/main/cpp/maps.cpp \
            integrity-native/src/main/cpp/safe_read.cpp \
            integrity-native/src/main/cpp/test/native_host_test.cpp \
            -o /tmp/native_host_test
          /tmp/native_host_test
      - name: Type-check the JNI boundary against the host JDK headers
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -DINTEGRITY_BUILD_TOKEN='"ci-host-token"' \
            integrity-native/src/main/cpp/integrity.cpp

      # uintptr_t is 32-bit on armeabi-v7a and 64-bit on arm64-v8a, and the overflow
      # guards are the code most sensitive to that difference. Every test so far has run
      # at 64 bits — the x86_64 emulator included — so the width this SDK actually ships
      # to on 32-bit devices had never executed these paths. gcc-multilib closes that in
      # seconds; if it ever turns fragile, an armeabi-v7a on-device path is the more
      # representative replacement.
      - name: Install the 32-bit host toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-multilib g++-multilib

      - name: Build and run the native host tests as 32-bit
        run: |
          set -euo pipefail
          g++ -m32 -std=c++17 -Wall -Wextra -Werror \
            -DINTEGRITY_BUILD_TOKEN='"ci-host-token"' \
            integrity-native/src/main/cpp/selfcheck.cpp \
            integrity-native/src/main/cpp/maps.cpp \
            integrity-native/src/main/cpp/safe_read.cpp \
            integrity-native/src/main/cpp/test/native_host_test.cpp \
            -o /tmp/native_host_test_32
          /tmp/native_host_test_32

      # ANDROID_STL=none provides no libc++ at all, so <cstddef> and friends do not exist
      # — only the libc headers do. -nostdinc++ reproduces that in seconds here instead of
      # two minutes into an NDK build. Added after exactly this slipped through: the host
      # check used -fno-exceptions but still had libstdc++ headers on the include path.
      - name: Reject C++ standard library headers in shipped sources
        run: |
          set -euo pipefail
          for f in maps.cpp safe_read.cpp selfcheck.cpp; do
            g++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions -nostdinc++ -fsyntax-only \
              -DINTEGRITY_BUILD_TOKEN='"ci-host-token"' "integrity-native/src/main/cpp/$f"
            echo "$f builds without libc++"
          done

  native-size-matrix:
    name: Native size trade (measurement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the pinned NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      # Answers the phase 3b prerequisite in docs/PLAN.md with numbers rather than
      # argument. Also a canary: it fails if the native code stops building under
      # -fno-exceptions, which would quietly remove an option before we have chosen.
      - name: Measure three configurations
        run: tools/measure-native-size.sh arm64-v8a
