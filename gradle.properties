org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Note: the ktlint plugin is not configuration-cache compatible, so run static analysis
# with --no-configuration-cache (as CI does): ./gradlew detekt ktlintCheck --no-configuration-cache

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official

# Phase 3 flips this on once the NDK is provisioned in CI.
integrity.enableNative=false
